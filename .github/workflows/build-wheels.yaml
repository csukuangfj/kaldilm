name: build-wheels

on:
  push:
    branches:
      - wheel
    tags:
      - '*'

  workflow_dispatch:

concurrency:
  group: build-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["cp38", "cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "cp315"]

    steps:
      - uses: actions/checkout@v4

      # see https://cibuildwheel.readthedocs.io/en/stable/changelog/
      # for a list of versions

      # CPython 3.8 is EOL and has been dropped upstream: the manylinux images
      # removed the interpreter on 2026-05-07 (pypa/manylinux#1884) and
      # cibuildwheel 4.0 dropped support for building it. The last combination
      # that still works is cibuildwheel 3.x plus a pinned image from before
      # that drop. cp315 needs cibuildwheel 4.x, so the two are split here.
      # The manylinux image setting is ignored on the Windows legs.
      - name: Build wheels (cp38)
        if: matrix.python-version == 'cp38'
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "cp27-* cp35-* *-win32 pp* *-musllinux*"
          CIBW_BUILD_VERBOSITY: 3
          # Install the built wheel into a test venv and exercise it before
          # anything can reach the publish step. {project} is the project
          # root; the smoke test imports only the installed package.
          CIBW_TEST_COMMAND: python {project}/scripts/smoke_test.py
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux2014_x86_64:2026.05.07-1

      - name: Build wheels
        if: matrix.python-version != 'cp38'
        uses: pypa/cibuildwheel@v4.3.2
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "cp27-* cp35-* *-win32 pp* *-musllinux*"
          CIBW_BUILD_VERBOSITY: 3
          # Install the built wheel into a test venv and exercise it before
          # anything can reach the publish step. {project} is the project
          # root; the smoke test imports only the installed package.
          CIBW_TEST_COMMAND: python {project}/scripts/smoke_test.py
          # cibuildwheel 4.x runs delvewheel repair by default on Windows.
          # _kaldilm.pyd is self-contained (kaldilm_core and openfst are linked
          # statically), so there is nothing for delvewheel to bundle and it
          # errors. Skip the repair step entirely.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/

          unzip -l ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-wheels-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel twine==5.0.0 setuptools
          twine upload --skip-existing ./wheelhouse/*.whl

      - name: Build sdist
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == 'cp38'
        shell: bash
        run: |
          python3 setup.py sdist
          ls -lh dist/*

      - name: Publish sdist to PyPI
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == 'cp38'
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          twine upload --skip-existing dist/kaldilm-*.tar.gz
