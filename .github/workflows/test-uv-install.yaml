name: test-uv-install

on:
  push:
    branches:
      - master
      - wheel-android
  workflow_dispatch:

concurrency:
  group: test-uv-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_uv_install:
    if: github.repository_owner == 'csukuangfj' || github.repository_owner == 'k2-fsa'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.architecture || ((contains(matrix.os, 'arm') || matrix.os == 'macos-14' || matrix.os == 'macos-latest') && 'arm64' || 'x64') }}
    strategy:
      fail-fast: false
      matrix:
        # These install from PyPI, so they verify the wheels we actually
        # publish. See https://github.com/actions/runner-images
        include:
          # Linux x64
          - os: ubuntu-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"

          # Linux arm64
          - os: ubuntu-24.04-arm
            python-version: "3.8"
          - os: ubuntu-24.04-arm
            python-version: "3.9"
          - os: ubuntu-24.04-arm
            python-version: "3.10"
          - os: ubuntu-24.04-arm
            python-version: "3.11"
          - os: ubuntu-24.04-arm
            python-version: "3.12"
          - os: ubuntu-24.04-arm
            python-version: "3.13"
          - os: ubuntu-24.04-arm
            python-version: "3.14"
          - os: ubuntu-24.04-arm
            python-version: "3.15"

          # macOS arm64 (we ship universal2 wheels, so they also work on x64)
          - os: macos-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.15"

          # Windows x64
          - os: windows-2022
            python-version: "3.8"
          - os: windows-2022
            python-version: "3.9"
          - os: windows-2022
            python-version: "3.10"
          - os: windows-2022
            python-version: "3.11"
          - os: windows-2022
            python-version: "3.12"
          - os: windows-2022
            python-version: "3.13"
          - os: windows-2022
            python-version: "3.14"
          - os: windows-2022
            python-version: "3.15"

          # Windows arm64 -- CPython only has arm64 builds from 3.11 on
          - os: windows-11-arm
            python-version: "3.11"
          - os: windows-11-arm
            python-version: "3.12"
          - os: windows-11-arm
            python-version: "3.13"
          - os: windows-11-arm
            python-version: "3.14"
          - os: windows-11-arm
            python-version: "3.15"

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        shell: bash
        run: |
          uv venv

      - name: Install kaldilm
        shell: bash
        run: |
          uv pip install --verbose -U kaldilm

      # uv run resolves the venv from the working directory, so this runs from
      # the repo root where .venv lives. The smoke test is invoked by path, so
      # sys.path[0] is scripts/ and `import kaldilm` resolves to the installed
      # wheel rather than the kaldilm/ directory at the repo root.
      - name: Test kaldilm
        shell: bash
        run: |
          uv run python scripts/smoke_test.py
