name: build-wheels-android-termux

# Builds Python wheels inside termux/termux-docker instead of with the Android
# NDK, so that the result imports in Termux. Cross-compiling with the NDK
# toolchain produces binaries that cannot load there.
#
# Unlike kaldi-native-fbank, nothing here needs patchelf: kaldilm_core and
# openfst are both linked statically into _kaldilm, so the extension is
# self-contained and the wheel carries no extra shared libraries.
#
# The termux-docker images are native binaries per architecture, so each ABI
# must run on a matching runner (an aarch64 image cannot exec on an x86_64
# runner -- "exec format error"). The container runs with --user 0:0 and the
# workspace is made writable on the host first; never call sudo or su inside it.
#
# The container script below is passed as a single-quoted argument to bash, so
# it must contain NO single quotes at all -- not even in comments.

on:
  push:
    branches:
      - wheel
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: build-wheels-android-termux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: aarch64
            os: ubuntu-24.04-arm
            plat: android_24_arm64_v8a
            makejobs: "-j$(nproc)"
          - abi: arm
            os: ubuntu-24.04-arm
            plat: android_24_armeabi_v7a
            # 32-bit ARM is the constrained leg: -j4 hit a make jobserver
            # failure ("duping jobs pipe: Bad file descriptor"). -j1 also keeps
            # make from creating a jobserver at all.
            makejobs: "-j1"
          - abi: x86_64
            os: ubuntu-latest
            plat: android_24_x86_64
            makejobs: "-j$(nproc)"
          - abi: i686
            os: ubuntu-latest
            plat: android_24_x86
            makejobs: "-j$(nproc)"

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel with the Termux toolchain
        shell: bash
        run: |
          mkdir -p build dist wheelhouse
          chmod -R a+w "${{ github.workspace }}"

          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/:/work \
            termux/termux-docker:${{ matrix.abi }} \
          bash -c '
            set -e

            apt update -y
            apt install -y cmake make git python python-pip clang libc++
            apt install -y android-liblog || true
            apt install -y libandroid-dev || true
            apt install -y android-libandroid || true

            pip install --upgrade pip setuptools wheel

            cd /work

            # Per-ABI parallelism -- see the matrix comments above. The shell
            # below expands $(nproc) when the value contains it.
            export KALDILM_MAKE_ARGS="${{ matrix.makejobs }}"

            # --plat-name is load-bearing: Termux CPython reports linux-aarch64
            # (etc.), so without it the wheel is mis-tagged linux_* and pip
            # refuses it on Android. API level 24 is the oldest level with
            # RUNPATH support.
            python3 setup.py bdist_wheel --plat-name=${{ matrix.plat }}

            ls -lh dist
          '

      - name: Display wheels
        shell: bash
        run: |
          # setup.py rewrites kaldilm/python/kaldilm/__init__.py, so the source
          # tree is dirty too -- take back everything the container touched.
          sudo chown -R "$USER" ./build ./dist ./wheelhouse ./kaldilm
          ls -lh ./dist/
          unzip -l ./dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-android-${{ matrix.abi }}
          path: ./dist/*.whl

      # The plat-name trick is the one part of this build that a green compile
      # does not prove; actually import it on the target ABI and compile a real
      # ARPA model before publishing.
      - name: Smoke test
        shell: bash
        run: |
          chmod -R a+w "${{ github.workspace }}"

          docker run --rm \
            --user 0:0 \
            --volume ${{ github.workspace }}/dist:/wheels:ro \
            --volume ${{ github.workspace }}/scripts/smoke_test.py:/test/smoke_test.py:ro \
            termux/termux-docker:${{ matrix.abi }} \
          bash -c '
            set -e

            apt update -y
            apt install -y python python-pip libc++ clang
            apt install -y android-liblog || true
            apt install -y libandroid-dev || true
            apt install -y android-libandroid || true

            pip install --upgrade pip setuptools wheel
            pip install /wheels/kaldilm-*.whl

            # termux has no writable /tmp and / is not writable, so use "/" as
            # a clean cwd. sys.path[0] is the directory of the script itself
            # (/test, holding only smoke_test.py), so the installed wheel is
            # what gets imported rather than the source tree.
            cd /
            python3 /test/smoke_test.py
          '

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-android-*
          path: /tmp/wheels
          merge-multiple: true

      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        shell: bash
        run: |
          ls -lh /tmp/wheels/

          python3 -m pip install --upgrade pip
          python3 -m pip install wheel twine==5.0.0 setuptools

          twine upload --skip-existing /tmp/wheels/*.whl
