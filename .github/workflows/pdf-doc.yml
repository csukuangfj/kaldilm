# refer to
# https://github.com/k2-fsa/sherpa/blob/master/.github/workflows/pdf-doc.yml
# and
# https://github.com/k2-fsa/kaldifst/blob/master/.github/workflows/pdf-doc.yml

# The PDF is published at
# https://github.com/csukuangfj/kaldilm/releases/tag/doc
name: Generate PDF doc
on:
  push:
    branches:
      - master
      - doc
      - fix-doc

  workflow_dispatch:

concurrency:
  group: pdf-doc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-doc:
    if: github.repository_owner == 'csukuangfj'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
    steps:
      # refer to https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Unlike kaldifst, these docs never import the kaldilm module (no
      # autodoc) and have no figures, so the whole Sphinx + latexmk run fits
      # inside the TeX Live container, exactly as sherpa does it.
      - name: Build PDF
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            --entrypoint /bin/bash \
            reitzig/texlive-full:latest \
            -c "
              uname -a
              cat /etc/*release
              which latexmk

              apk add --no-cache python3 py3-pip git make gcc zlib-dev libffi-dev openssl-dev musl-dev ghostscript curl

              python3 --version

              python3 -m venv abc
              source ./abc/bin/activate
              python3 -m ensurepip
              python3 -m pip install -r ./docs/requirements.txt

              cd docs
              make latexpdf
              cd build/latex

              find . -name '*.pdf'
              ls -lh kaldilm.pdf
              cp -v kaldilm.pdf /workspace/
            "

      - name: View generated files
        shell: bash
        run: |
          ls -lh kaldilm.pdf

      - name: Release kaldilm.pdf
        uses: svenstaro/upload-release-action@v2
        with:
          file_glob: true
          overwrite: true
          file: ./kaldilm.pdf
          tag: doc
